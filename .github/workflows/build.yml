name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.value }}" installer\speedmeter.iss

      - name: Collect artifacts
        shell: pwsh
        run: |
          Copy-Item target\release\speedmeter.exe dist\speedmeter.exe
          Copy-Item Cargo.lock dist\Cargo.lock
          Get-Item dist\speedmeter.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: InternetSpeedMeter
          path: |
            dist/InternetSpeedMeter-Setup-*.exe
            dist/speedmeter.exe
            dist/Cargo.lock

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/InternetSpeedMeter-Setup-*.exe
            dist/speedmeter.exe
          generate_release_notes: true
